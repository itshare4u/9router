name: Publish GitHub package

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@itshare4u"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Install CLI dependencies
        run: npm install --prefix cli --no-audit --no-fund

      - name: Read package metadata
        id: package
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = require("./cli/package.json");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE

      - name: Check whether version exists
        id: published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI package
        if: steps.published.outputs.exists != 'true'
        run: npm run build:cli

      - name: Publish CLI package
        if: steps.published.outputs.exists != 'true'
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts
